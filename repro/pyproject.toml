[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqnselector-repro"
version = "0.1.0"
description = "Clean reproduction of DQNSelector from the SIGIR 2024 paper specification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
